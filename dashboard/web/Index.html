<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --navy:#00004d; --gold:#FFD700; --bg:#0a0a1a; --card:#14142b; --card2:#1a1a3a; --line:#2b2b55;
            --text:#e8e8f0; --muted:#9aa0c0; --good:#22dd66; --bad:#ff4d4d; --blue:#2f7bff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    button, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    header { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #00001a, var(--navy) 55%, #000080);
             padding: 10px 14px 12px; box-shadow: 0 4px 18px rgba(0,85,255,.35); }
    header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
      background: linear-gradient(135deg, var(--gold) 25%, transparent 25%) -6px 0/12px 12px repeat-x,
                  linear-gradient(225deg, var(--gold) 25%, transparent 25%) -6px 0/12px 12px repeat-x; }
    .brand { color: var(--gold); font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px #0055ff; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sub { color: #bcdcff; font-size: .85rem; }
    .sync { padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: .85rem; background: #06361b; color: var(--good); }
    .sync.stale { background: #3d0a10; color: var(--bad); animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    main { max-width: 900px; margin: 0 auto; padding: 18px 12px 60px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
    .panel h3 { margin: 0 0 8px; color: var(--gold); font-size: .9rem; text-transform: uppercase; letter-spacing: .5px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); background: var(--card2); border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: .9rem; }
    .chip.on { background: var(--gold); color: #000; border-color: var(--gold); }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
    .filters select { width: 100%; }
    .filters label { font-size: .75rem; color: var(--muted); text-transform: uppercase; display: grid; gap: 3px; }
    select { background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .draft { color: var(--gold); font-size: .7rem; font-weight: 800; border: 1px solid var(--gold); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
    .hint { color: var(--muted); font-size: .85rem; margin: 4px 0 10px; }
    .card > div { min-width: 0; }   /* let long text wrap instead of widening the page */
    .scout-note, .stats { overflow-wrap: anywhere; }
    .card { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; background: var(--card); border: 1px solid var(--line);
            border-radius: 14px; padding: 10px; margin-bottom: 10px; border-left: 5px solid var(--line); }
    .card.Target { border-left-color: var(--good); } .card.Backup { border-left-color: var(--blue); } .card.Avoid { border-left-color: var(--bad); opacity: .8; }
    .card.dragging { opacity: .9; box-shadow: 0 10px 30px rgba(0,0,0,.6); border-color: var(--gold); position: relative; z-index: 5; }
    .rankcol { display: grid; justify-items: center; align-content: start; gap: 4px; }
    .rank { font-size: 1.3rem; font-weight: 900; color: var(--gold); }
    .handle { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font-size: 1.2rem; touch-action: none; }
    .mv { width: 40px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--card2); color: var(--muted); font-size: .8rem; }
    .team { font-size: 1.5rem; font-weight: 900; }
    .name { color: var(--muted); font-weight: 600; margin-left: 6px; font-size: .95rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    .badge { font-size: .78rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line); }
    .badge.High { color: var(--good); border-color: #1d6b3d; } .badge.Mid { color: #ffd76a; border-color: #6b5a1d; } .badge.Low { color: #ff9a9a; border-color: #6b1d26; }
    .stats { color: var(--muted); font-size: .88rem; }
    .stats b { color: var(--text); }
    .tags { display: flex; gap: 6px; margin: 8px 0; }
    .tag { flex: 1; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); font-weight: 800; }
    .tag.on.Target { background: var(--good); color: #000; } .tag.on.Backup { background: var(--blue); color: #fff; } .tag.on.Avoid { background: var(--bad); color: #000; }
    textarea { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 40px; }
    textarea:focus { outline: none; border-color: var(--gold); }
    .note-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; margin-top: 6px; display: flex; justify-content: space-between; }
    .saved { color: var(--good); }
    details summary { color: var(--muted); font-size: .85rem; cursor: pointer; margin-top: 6px; }
    .scout-note { font-size: .85rem; border-left: 3px solid var(--blue); padding: 2px 8px; margin: 4px 0; }
    .msg { text-align: center; padding: 40px 16px; color: var(--muted); }
    .error { color: var(--bad); font-weight: 700; }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222244; border: 1px solid var(--line);
             padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 92vw; }
    #toast.show { opacity: 1; } #toast.bad { border-color: var(--bad); background: #3a0d14; }
    nav.views { display: flex; gap: 6px; margin-top: 10px; }
    nav.views button { flex: 1; min-width: 0; min-height: 38px; padding: 0 3px; border-radius: 8px; border: 1px solid #2b2b8a; background: rgba(0,0,0,.25); color: #bcdcff; font-weight: 800; font-size: .78rem; line-height: 1.15; }
    nav.views button.on { background: var(--gold); color: #000; border-color: var(--gold); }
    .ext { color: #bcdcff; font-size: .88rem; margin-top: 3px; }
    .ext b { color: var(--text); }
    .unscouted { color: var(--muted); font-style: italic; font-size: .88rem; }
    /* Next match */
    .match-pick { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .match-pick select { flex: 1; }
    .alliances { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .alliance { border-radius: 14px; padding: 10px; border: 2px solid var(--line); background: var(--card); }
    .alliance.red { border-color: #8a1d2a; } .alliance.blue { border-color: #1d3f8a; }
    .alliance.ours { box-shadow: 0 0 0 2px var(--gold); }
    .alliance h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .alliance.red h2 { color: #ff7a8a; } .alliance.blue h2 { color: #7ab0ff; }
    .totals { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
    .totals b { color: var(--text); font-size: 1rem; }
    .mini { border-top: 1px solid var(--line); padding: 8px 0; }
    .mini.us .team { color: var(--gold); }
    .mini .team { font-size: 1.25rem; }
    .result-line { text-align: center; font-weight: 900; font-size: 1.1rem; margin: 0 0 12px; }
    /* Data health */
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .92rem; }
    .kv .k { color: var(--muted); }
    .good { color: var(--good); } .bad { color: var(--bad); }
    .pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { font-size: .82rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line); }
    .pill.bad { border-color: #6b1d26; color: #ff9a9a; } .pill.warn { border-color: #6b5a1d; color: #ffd76a; }
    .big-stat { font-size: 1.15rem; font-weight: 900; margin: 0 0 8px; }
    /* Official list vs My list */
    .seg { display: flex; gap: 6px; margin-bottom: 8px; }
    .seg button { flex: 1; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); font-weight: 800; }
    .seg button.on { background: var(--gold); color: #000; border-color: var(--gold); }
    .role { font-size: .88rem; color: var(--muted); }
    .role b { color: var(--text); }
    .role.warn { color: #ffd76a; }
    .mode-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .mode-actions[hidden] { display: none; }
    .mode-actions button { border-radius: 8px; border: 1px solid var(--line); background: var(--card2); padding: 7px 12px; font-weight: 700; font-size: .85rem; }
    .chip.locked, .tag:disabled { opacity: .55; cursor: not-allowed; }
    .readonly-note { font-size: .9rem; background: var(--card2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px; min-height: 20px; overflow-wrap: anywhere; }
    .card.mine-view { border-style: dashed; border-left-style: solid; }
    /* Alliance selection: picked by another alliance */
    .card.picked { opacity: .45; }
    .card.picked .team { text-decoration: line-through; }
    .badge.picked { background: var(--muted); color: #000; border-color: var(--muted); }
    .tag.pk { flex: .9; } .tag.pk.on { background: var(--muted); color: #000; }
    .best { border-color: var(--gold); }
    .best-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
    .best-list .pick { font-size: 1.25rem; font-weight: 900; color: var(--gold); }
    .best-list .pick small { color: var(--muted); font-size: .8rem; font-weight: 700; margin-right: 3px; }
    /* Analyze */
    .chart-box { position: relative; width: 100%; }
    .an-note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
    .an-note b { color: var(--text); }
    .cmp-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
    .cmp-pick select { width: 100%; min-width: 0; }
    table.cmp { width: 100%; border-collapse: collapse; font-size: .88rem; }
    table.cmp th, table.cmp td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
    table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--muted); font-weight: 600; }
    table.cmp th { color: var(--gold); font-size: 1rem; }
    table.cmp td.top { color: var(--gold); font-weight: 900; }
    .pit-kv { font-size: .85rem; margin-top: 6px; overflow-wrap: anywhere; }
    /* Lookup + match13 */
    .lookup-form { display: flex; gap: 8px; margin-bottom: 8px; }
    .lookup-form input { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: 1.2rem; color: var(--text); }
    .lookup-form button { border-radius: 8px; border: 1px solid var(--gold); background: var(--gold); color: #000; font-weight: 800; padding: 0 16px; }
    .lookup-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 10px; }
    .lookup-head .team { font-size: 2rem; color: var(--gold); }
    .lookup-head a { color: #7ab0ff; font-weight: 700; font-size: .9rem; margin-left: auto; }
    .forecast { text-align: center; color: var(--muted); margin: -4px 0 12px; font-size: .92rem; }
    .forecast b { color: var(--text); }
  </style>
</head>
<body data-me="<?= me ?>">
  <header>
    <div class="head-row">
      <div><div class="brand">⚡ WARLOCKS 1507 PICK LIST</div><div class="sub" id="event">Loading…</div></div>
      <span class="sync" id="sync">—</span>
    </div>
    <nav class="views">
      <button data-view="pick" class="on">Pick list</button>
      <button data-view="next">Next match</button>
      <button data-view="health">Data health</button>
      <button data-view="analyze">Analyze</button>
      <button data-view="lookup">Lookup</button>
    </nav>
  </header>
  <main>
    <section id="v-pick">
      <div class="panel">
        <div class="seg">
          <button id="mode-official" data-mode="official">Official list</button>
          <button id="mode-mine" data-mode="mine">My list</button>
        </div>
        <div class="role" id="role"></div>
        <div class="mode-actions" id="mode-actions" hidden>
          <button id="mine-copy">Start from the official list</button>
          <button id="mine-clear">Clear my list</button>
        </div>
      </div>
      <div class="panel">
        <h3>Our robot needs <span class="draft">DRAFT fit</span></h3>
        <div class="chips" id="gaps"></div>
      </div>
      <div class="panel">
        <div class="filters">
          <label>Scoring<select id="f-scoring"><option value="">All</option><option>High</option><option>Mid</option><option>Low</option></select></label>
          <label>Bot type<select id="f-type"><option value="">All</option><option>Scorer</option><option>Feeder</option><option>Defense</option><option>Hybrid</option></select></label>
          <label>Strength (draft)<select id="f-strength"><option value="">All</option><option>High</option><option>Mid</option><option>Low</option></select></label>
          <label>Fit<select id="f-fit"><option value="">All</option><option>High</option><option>Mid</option><option>Low</option></select></label>
          <label>Tag<select id="f-tag"><option value="">All</option><option>Target</option><option>Backup</option><option>Avoid</option><option value="none">Untagged</option></select></label>
          <label>Sort<select id="f-sort"><option value="">Pick order</option><option value="epa">EPA</option><option value="fuel">Scouted fuel</option><option value="tba">TBA rank</option></select></label>
          <label>Trench<select id="f-trench"><option value="">All</option><option value="trench">Trench bot</option><option value="bump">Bump only</option></select></label>
          <label>Picked<select id="f-picked"><option value="">Show</option><option value="hide">Hide picked</option></select></label>
        </div>
      </div>
      <div class="panel best" id="best" hidden></div>
      <p class="hint" id="hint"></p>
      <div id="list"><div class="msg">Loading pick list…</div></div>
    </section>
    <section id="v-next" hidden><div class="msg">Loading…</div></section>
    <section id="v-health" hidden><div class="msg">Loading…</div></section>
    <section id="v-analyze" hidden><div class="msg">Loading…</div></section>
    <section id="v-lookup" hidden>
      <div class="panel">
        <h3>Look up a team</h3>
        <form id="lookup-form" class="lookup-form">
          <input id="lookup-input" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Team number" autocomplete="off" aria-label="Team number">
          <button type="submit">Look up</button>
        </form>
        <div class="chips" id="lookup-recent"></div>
      </div>
      <div id="lookup-result"><p class="hint">Any FRC team: match13's 2026 rating, plus everything we've scouted if they're at our event.</p></div>
    </section>
    <p class="hint" id="me"></p>
  </main>
  <div id="toast"></div>

<script>
  // ---------- helpers (text only — never build HTML from data) ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
      });
    }
    return el;
  }
  function $(id) { return document.getElementById(id); }
  function pct(x) { return Math.round((Number(x) || 0) * 100) + '%'; }
  var toastTimer;
  function toast(msg, bad) {
    var t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, bad ? 5000 : 1800);
  }
  /** google.script.run as a Promise */
  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      r[fn].apply(r, args);
    });
  }

  var data = null;
  var editing = false;   // don't refresh under someone's fingers

  // ---------- sync freshness ----------
  function renderSync() {
    var el = $('sync');
    if (!data || !data.lastSyncMs) { el.textContent = 'Never synced'; el.className = 'sync stale'; return; }
    var skew = data.now - data.loadedAt;  // server clock vs this device
    var mins = Math.floor((Date.now() + skew - data.lastSyncMs) / 60000);
    el.textContent = mins < 1 ? 'Synced just now' : 'Synced ' + mins + ' min ago';
    el.className = mins >= 10 ? 'sync stale' : 'sync';
    if (mins >= 10) el.textContent += ' — STALE';
  }
  setInterval(renderSync, 15000);

  // ---------- gaps ----------
  function renderGaps() {
    var lead = data.role && data.role.lead;
    $('gaps').replaceChildren.apply($('gaps'), data.gapDefs.map(function (g) {
      var on = data.gaps.indexOf(g.id) >= 0;
      return h('button', { class: 'chip' + (on ? ' on' : '') + (lead ? '' : ' locked'), onclick: function () {
        if (!lead) { toast('Only pick leads set what our robot needs (it changes everyone\'s Fit).', true); return; }
        data.gaps = on ? data.gaps.filter(function (x) { return x !== g.id; }) : data.gaps.concat([g.id]);
        call('saveGaps', data.gaps).then(function () { load(); }).catch(function (e) { toast(e.message, true); });
        renderGaps();
      } }, g.label);
    }));
  }

  // ---------- list ----------
  var FILTER_IDS = ['f-scoring', 'f-type', 'f-strength', 'f-fit', 'f-tag', 'f-sort', 'f-trench', 'f-picked'];
  function has(x) { return x !== '' && x !== null && x !== undefined; }
  /** Sort descending by a number; teams without one go last. */
  function byNumber(key, asc) {
    return function (a, b) {
      if (!has(a[key]) || !has(b[key])) return has(a[key]) ? -1 : has(b[key]) ? 1 : a.team - b.team;
      return asc ? a[key] - b[key] : b[key] - a[key];
    };
  }
  // ---------- Official list vs My list ----------
  // Official: the pick leads' list (everyone sees it; only leads change it).
  // Mine: this person's own practice order + tags, saved for them only.
  var mode = 'official';
  try { mode = localStorage.getItem('pickMode') === 'mine' ? 'mine' : 'official'; } catch (e) { /* storage blocked */ }
  function mine() { return mode === 'mine'; }
  function rankOf(t) { return mine() ? t.my_rank : t.rank; }
  function tagOf(t) { return mine() ? t.my_tag : t.tag; }
  function canEdit() { return mine() || !!(data.role && data.role.lead); }

  /** Teams in the current list's order: official order, or my ranks first, then the rest in official order. */
  function ordered() {
    if (!mine()) return data.teams.slice();
    var pos = {};
    data.teams.forEach(function (t, i) { pos[t.team] = i; });
    return data.teams.slice().sort(function (a, b) {
      var ra = a.my_rank, rb = b.my_rank;
      if (ra !== null && rb !== null) return ra - rb;
      if (ra !== null) return -1;
      if (rb !== null) return 1;
      return pos[a.team] - pos[b.team];
    });
  }

  function renderMode() {
    $('mode-official').classList.toggle('on', !mine());
    $('mode-mine').classList.toggle('on', mine());
    $('mode-actions').hidden = !mine();
    var r = data.role || {};
    var who = r.lead ? (r.open ? 'Everyone can edit' : 'You\'re a pick lead') : 'Viewer';
    var text = mine()
      ? [h('b', null, 'My list'), ' — your own practice order and tags. Only you see it; it never changes the official list.']
      : r.lead
        ? [h('b', null, who), ' — changes to order, tags and shared notes save for the whole pick team.']
        : [h('b', null, who), ' — the official list is set by the pick leads. Switch to ', h('b', null, 'My list'), ' to try your own.'];
    $('role').replaceChildren.apply($('role'), text);
    $('role').className = 'role' + (r.open && !mine() ? ' warn' : '');
    if (r.open && !mine()) {
      $('role').append(h('div', { style: 'margin-top:4px' }, '⚠ No pick leads are listed yet, so anyone can change the official list. ' +
        'The team account can add pick leads\' emails on the Leads tab of the scouting Sheet.'));
    }
  }
  ['mode-official', 'mode-mine'].forEach(function (id) {
    $(id).addEventListener('click', function () {
      mode = $(id).dataset.mode;
      try { localStorage.setItem('pickMode', mode); } catch (e) { /* storage blocked */ }
      renderMode(); render();
    });
  });
  $('mine-copy').addEventListener('click', function () {
    if (data.teams.some(function (t) { return t.my_rank !== null || t.my_tag; }) &&
        !confirm('Replace your list with a copy of the official order and tags?')) return;
    call('copyOfficialToMine').then(function () { toast('Copied the official list'); return load(); }).catch(function (e) { toast(e.message, true); });
  });
  $('mine-clear').addEventListener('click', function () {
    if (!confirm('Clear your list? (The official list is not affected.)')) return;
    call('clearMyList').then(function () { toast('Your list is cleared'); return load(); }).catch(function (e) { toast(e.message, true); });
  });

  function filtered() {
    var f = { scoring: $('f-scoring').value, type: $('f-type').value, strength: $('f-strength').value, fit: $('f-fit').value, tag: $('f-tag').value,
      hidePicked: $('f-picked').value === 'hide', trench: $('f-trench').value };
    var list = ordered().filter(function (t) {
      var tag = tagOf(t);
      return (!f.scoring || t.scoring_level === f.scoring) && (!f.type || t.bot_type === f.type) &&
        (!f.strength || t.strength === f.strength) && (!f.fit || t.fit === f.fit) &&
        (!f.tag || (f.tag === 'none' ? !tag : tag === f.tag)) && (!f.hidePicked || !t.picked) &&
        (!f.trench || (f.trench === 'bump' ? t.trench === 'bump' : t.trench === 'seen' || t.trench === 'claimed'));
    });
    var sort = $('f-sort').value;
    if (sort === 'epa') list.sort(byNumber('epa'));

  // 3. Our scouting vs Statbotics EPA

    var pts = scouted.filter(function (t) { return has(t.epa); }).map(function (t) {

    var table = h('table', { class: 'cmp' }, h('tr', null, h('th', null, ''), teams.map(function (t, i) {
      return h('th', { style: 'color:' + CMP_COLORS[i] }, String(t.team));
    })), CMP_ROWS.map(function (row) {
      var vals = teams.map(function (t) {
        if (row[4]) return row[4](t);
        return Number(t.matches) || ['epa', 'xp', 'opr', 'rank_tba', 'sim_rank'].indexOf(row[1]) >= 0 ? t[row[1]] : '';
      });
      var nums = vals.map(num).filter(function (v) { return v !== null; });
      var best = row[2] && nums.length > 1 ? (row[2] > 0 ? Math.max : Math.min).apply(null, nums) : null;
      return h('tr', null, h('td', null, row[0]), vals.map(function (v) {
        var shown = !has(v) ? '—' : row[3] ? row[3](v) : (row[1] === 'rank_tba' || row[1] === 'sim_rank' ? '#' : '') + v;
        return h('td', { class: best !== null && num(v) === best ? 'top' : '' }, shown);
      }));
    }));
    var cmp = h('div', { class: 'panel' }, h('h3', null, 'Compare teams'), picks,
      teams.length ? table : h('p', { class: 'hint' }, 'Choose up to three teams.'));

    // Fuel per match over time, one line per team.
    var longest = Math.max.apply(null, [0].concat(teams.map(function (t) { return (t.series || []).length; })));
    var trend = longest ? chartPanel('Match by match', 'Fuel scored in each team\'s matches, in the order they played. A gap = no-show.', 240, function () {
      var labels = []; for (var i = 1; i <= longest; i++) labels.push('M' + i);
      return { type: 'line', data: { labels: labels, datasets: teams.map(function (t, i) {
        return { label: String(t.team), data: (t.series || []).map(function (s) { return s.ns ? null : r1((s.auto || 0) + (s.tele || 0)); }),
          borderColor: CMP_COLORS[i], backgroundColor: CMP_COLORS[i], tension: 0.2, pointRadius: 3 };
      }) }, options: { plugins: { legend: { labels: { boxWidth: 10 } }, tooltip: { callbacks: { title: function (c) {
        var s = (teams[c[0].datasetIndex].series || [])[c[0].dataIndex]; return s ? s.m.replace(/^qm/, 'Q') : '';
      } } } }, scales: { y: { beginAtZero: true, title: { display: true, text: 'Fuel' } } } } };
    }) : teams.length ? notePanel('Match by match', 'Match-by-match data arrives with the first sync after this update.') : null;

    // Us + the first two compared teams, against a typical alliance here.
    var us = data.us && Number(data.us.matches) ? data.us : null;
    var members = (us ? [us] : []).concat(teams.slice(0, 2));
    var scouted = data.teams.filter(function (t) { return Number(t.matches) > 0; });
    var sum = function (k) { return r1(members.reduce(function (a, t) { return a + (Number(t[k]) || 0); }, 0)); };
    var epaHave = members.filter(function (t) { return has(t.epa); });
    var allWork = members.reduce(function (a, t) { return a * (Number(t.reliability) || 0); }, 1);
    var typical = r1(3 * median(scouted.map(function (t) { return Number(t.avg_total) || 0; })));
    var typicalEpa = r1(3 * median(data.teams.filter(function (t) { return has(t.epa); }).map(function (t) { return Number(t.epa); })));
    var kv = function (k, v, cls) { return [h('span', { class: 'k' }, k), h('span', { class: cls || '' }, v)]; };
    var alliance = teams.length ? h('div', { class: 'panel' },
      h('h3', null, 'Alliance builder: ' + (us ? data.ourTeam + ' + ' : '') + teams.slice(0, 2).map(function (t) { return t.team; }).join(' + ')),
      h('div', { class: 'kv' },
        kv('Fuel per match', String(sum('avg_total')) + '  (typical alliance here: ' + typical + ')', sum('avg_total') >= typical ? 'good' : 'bad'),
        kv('  in auto', String(sum('avg_auto'))),
        kv('Robots climbing (expected)', sum('climb_l1') + ' of ' + members.length),
        kv('Level 3 climbs (expected)', String(sum('climb_l3'))),
        kv('EPA total', epaHave.length ? String(r1(epaHave.reduce(function (a, t) { return a + Number(t.epa); }, 0))) +
          (epaHave.length < members.length ? ' (' + epaHave.length + ' of ' + members.length + ' teams)' : '') + (typicalEpa ? '  (typical: ' + typicalEpa + ')' : '') : '—'),
        kv('All working (reliability)', pct(allWork))),
      h('p', { class: 'an-note' }, us ? 'Uses the first two compared teams. "Typical" = three median teams at this event.'
        : 'We haven\'t been scouted yet, so these totals are the picks only.')) : null;
    return [cmp, trend, alliance];
  }

  function renderAnalyze() {
    var box = $('v-analyze');
    if (!data || !data.gapDefs) return;   // pick list not loaded yet; load() calls back here
    var sig = JSON.stringify([data.teams, data.us, cmpSel]);
    if (sig === drawnSig && charts.length) return;   // nothing changed since the last draw
    loadChartJs().then(function () {
      charts.forEach(function (c) { c.destroy(); }); charts = [];
      drawnSig = sig;
      var scouted = data.teams.filter(function (t) { return Number(t.matches) > 0; });
      var byNum = {};
      data.teams.forEach(function (t) { byNum[t.team] = t; });
      if (!scouted.length) {
        box.replaceChildren(h('div', { class: 'msg' }, 'No scouting data yet — charts appear after the first sync.'));
        return;
      }
      var panels = comparePanels(byNum).concat([scatterPanel(scouted), consistencyPanel(scouted), epaPanel(scouted),
        phasePanel(scouted), climbPanel(scouted)]).filter(Boolean);
      box.replaceChildren.apply(box, [h('p', { class: 'hint' }, 'Based on ' + scouted.length + ' scouted teams. Team ' + data.ourTeam +
        ' is left out of the charts (we can\'t pick ourselves).')].concat(panels));
      panels.forEach(function (p) { if (p._make) p._make(); });
    }).catch(function (e) { box.replaceChildren(h('div', { class: 'msg error' }, e.message)); });
  }

  setInterval(function () { if (!editing && document.visibilityState === 'visible') refreshView(); }, 60000);
  var saved = readSaved();
  if (saved) showPickList(saved, true);
  load();
</script>
</body>
</html>
