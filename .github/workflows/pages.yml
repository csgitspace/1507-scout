# Runs the tests, then publishes the iPad scout app to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Site: https://<owner>.github.io/<repo>/scout-app/
name: Deploy scout app

on:
  push:
    branches: [main]
    paths: ['scout-app/**', 'shared/**', 'laptop/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}scout-app/
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (scout-app + the shared code it imports)
        run: |
          mkdir -p _site
          cp -r scout-app shared _site/
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=scout-app/">' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
